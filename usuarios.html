<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários - Sistema Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Cadastro de Usuários</h1>
            <p>Registre novos colaboradores no sistema</p>
        </div>
    </header>

    <nav class="main-nav">
        <div class="container">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="usuarios.html" class="active">Cadastrar Usuários</a></li>
                <li><a href="tarefas.html">Cadastrar Tarefas</a></li>
                <li><a href="gerenciamento.html">Gerenciar Tarefas</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="form-section">
            <h2>Novo Usuário</h2>
            
            <form id="form-usuario">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="email-error"></span>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
                    <button type="reset" class="btn btn-secondary">Limpar</button>
                </div>
            </form>
            
            <div id="mensagem-sucesso" class="mensagem-sucesso" style="display: none;">
                Cadastro concluído com sucesso!
            </div>
        </section>
        
        <section class="list-section">
            <h2>Usuários Cadastrados</h2>
            <div id="lista-usuarios" class="lista-usuarios">
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Sistema Kanban - Indústria Alimentícia</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
