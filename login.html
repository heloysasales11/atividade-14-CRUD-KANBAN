<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Sistema Kanban</h1>
            <p class="auth-subtitle">Indústria Alimentícia</p>
            
            <form id="form-login" class="auth-form">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>
            
            <div class="auth-links">
                <p>Não tem conta? <a href="registro.html">Cadastre-se</a></p>
            </div>
            
            <div id="mensagem-erro" class="mensagem-erro" style="display: none;"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
